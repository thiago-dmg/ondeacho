# CI (Node + Flutter) e deploy para produção na VPS (API + site + migrações) num único fluxo em push para main.
#
# Secrets obrigatórios: VPS_SSH_HOST, VPS_SSH_USER, VPS_SSH_KEY
# Variáveis opcionais (GitHub → Settings → Variables): NEXT_PUBLIC_API_URL, NEXT_PUBLIC_SITE_URL
#
# Na VPS (uma vez): systemd `ondeacho-api` (:3000) e `ondeacho-web` (:3002); Nginx → proxy só para Node
# (não sirvas `/_next/static` a partir de disco). Ver docs/deploy-acoes-github-producao.md
#
# Falha «dial tcp …:22: i/o timeout»: docs/deploy-vps.md (firewall / SSH).

name: CI and Deploy

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      next_public_api_url:
        description: "Sobrescreve NEXT_PUBLIC_API_URL no build do admin e do site (opcional)"
        required: false
        type: string
        default: ""

concurrency:
  group: ci-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_NAME_API: ondeacho-api
  REMOTE_DIR_API: /var/www/ondeacho-api
  API_PORT: 3000
  SERVICE_NAME_ADMIN: ondeacho-admin
  REMOTE_DIR_ADMIN: /var/www/ondeacho-admin
  ADMIN_PORT: 3001
  SERVICE_NAME_WEB: ondeacho-web
  REMOTE_DIR_WEB: /var/www/ondeacho-web
  WEB_PORT: 3002
  DEFAULT_NEXT_PUBLIC_API_URL: /api/v1
  DEFAULT_NEXT_PUBLIC_SITE_URL: https://ondeachotea.com

jobs:
  paths:
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            admin:
              - 'apps/admin/**'
              - '.github/workflows/ci-deploy.yml'

  ci-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Lint backend
        run: npm run lint:backend

      - name: Lint admin
        run: npm run lint:admin

      - name: Lint web
        run: npm run lint:web

      - name: Build backend (bloqueia merge quebrado)
        run: npm run build --workspace apps/backend

      - name: Build site apps/web (bloqueia merge quebrado)
        env:
          NODE_ENV: production
        run: npm run build --workspace apps/web

  ci-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get
        working-directory: apps/mobile

      - name: Flutter analyze
        run: flutter analyze
        working-directory: apps/mobile

  # Um único deploy em main: backend + migrações + site + restarts (sem depender de filtros por pasta).
  deploy-production:
    needs: [ci-node, ci-mobile]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolver NEXT_PUBLIC_API_URL e NEXT_PUBLIC_SITE_URL
        env:
          FROM_VARS_API: ${{ vars.NEXT_PUBLIC_API_URL }}
          FROM_SECRETS_API: ${{ secrets.NEXT_PUBLIC_API_URL }}
          FROM_INPUT: ${{ github.event.inputs.next_public_api_url || '' }}
          FALLBACK_API: ${{ env.DEFAULT_NEXT_PUBLIC_API_URL }}
          FROM_VARS_SITE: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          FROM_SECRETS_SITE: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          FALLBACK_SITE: ${{ env.DEFAULT_NEXT_PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          API_VAL=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${FROM_INPUT:-}" ]; then
            API_VAL="${FROM_INPUT}"
            SRC_API="workflow_dispatch input"
          elif [ -n "${FROM_VARS_API:-}" ]; then
            API_VAL="${FROM_VARS_API}"
            SRC_API="vars.NEXT_PUBLIC_API_URL"
          elif [ -n "${FROM_SECRETS_API:-}" ]; then
            API_VAL="${FROM_SECRETS_API}"
            SRC_API="secrets.NEXT_PUBLIC_API_URL"
          else
            API_VAL="${FALLBACK_API}"
            SRC_API="default (same-origin /api/v1)"
          fi
          echo "NEXT_PUBLIC_API_URL=${API_VAL}" >> "$GITHUB_ENV"
          echo "::notice::NEXT_PUBLIC_API_URL=${API_VAL} (${SRC_API})"

          SITE_VAL=""
          if [ -n "${FROM_VARS_SITE:-}" ]; then
            SITE_VAL="${FROM_VARS_SITE}"
            SRC_SITE="vars.NEXT_PUBLIC_SITE_URL"
          elif [ -n "${FROM_SECRETS_SITE:-}" ]; then
            SITE_VAL="${FROM_SECRETS_SITE}"
            SRC_SITE="secrets.NEXT_PUBLIC_SITE_URL"
          else
            SITE_VAL="${FALLBACK_SITE}"
            SRC_SITE="default ondeachotea.com"
          fi
          echo "NEXT_PUBLIC_SITE_URL=${SITE_VAL}" >> "$GITHUB_ENV"
          echo "::notice::NEXT_PUBLIC_SITE_URL=${SITE_VAL} (${SRC_SITE})"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build backend
        run: npm run build --workspace apps/backend

      - name: Build site (apps/web)
        env:
          NODE_ENV: production
        run: npm run build --workspace apps/web

      - name: Prune devDependencies (artefacto de runtime mais leve)
        run: npm prune --omit=dev

      - name: Empacotar API
        run: |
          set -e
          mkdir -p pkg-api/apps/backend
          cp package.json package-lock.json pkg-api/
          cp -r node_modules pkg-api/
          cp apps/backend/package.json pkg-api/apps/backend/
          cp -r apps/backend/dist pkg-api/apps/backend/
          tar -czf ondeacho-api.tar.gz -C pkg-api .

      - name: Empacotar site (apps/web)
        run: |
          set -e
          mkdir -p pkg-web/apps/web
          cp package.json package-lock.json pkg-web/
          cp -r node_modules pkg-web/
          cp apps/web/package.json pkg-web/apps/web/
          cp apps/web/next.config.js pkg-web/apps/web/
          if [ -f apps/web/middleware.ts ]; then cp apps/web/middleware.ts pkg-web/apps/web/; fi
          if [ -d apps/web/public ]; then cp -r apps/web/public pkg-web/apps/web/; fi
          cp -r apps/web/.next-build pkg-web/apps/web/
          tar -czf ondeacho-web.tar.gz -C pkg-web .

      - name: Unit files systemd (API + site)
        run: |
          cat > ondeacho-api.service <<EOF
          [Unit]
          Description=OndeAcho API (Node.js / NestJS)
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=${{ env.REMOTE_DIR_API }}/current
          ExecStart=/usr/bin/node apps/backend/dist/main.js
          Restart=always
          RestartSec=5
          KillSignal=SIGINT
          SyslogIdentifier=ondeacho-api
          Environment=NODE_ENV=production
          EnvironmentFile=/etc/ondeacho-api.env

          [Install]
          WantedBy=multi-user.target
          EOF

          REMOTE_WEB="${{ env.REMOTE_DIR_WEB }}"
          PORT_WEB="${{ env.WEB_PORT }}"
          cat > ondeacho-web.service <<EOF
          [Unit]
          Description=OndeAcho site público (Next.js)
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=${REMOTE_WEB}/current/apps/web
          ExecStart=/usr/bin/node ${REMOTE_WEB}/current/node_modules/next/dist/bin/next start -H 0.0.0.0 -p ${PORT_WEB}
          Restart=always
          RestartSec=5
          KillSignal=SIGINT
          SyslogIdentifier=ondeacho-web
          Environment=NODE_ENV=production

          [Install]
          WantedBy=multi-user.target
          EOF

      - name: Upload artefactos para VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "ondeacho-api.tar.gz,ondeacho-web.tar.gz,ondeacho-api.service,ondeacho-web.service"
          target: "/tmp/deploy-prod-${{ github.run_id }}"
          overwrite: true

      - name: Deploy na VPS — migrações, API, site, restarts
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -eu

            COMMIT="${{ github.sha }}"
            RUN_DIR="/tmp/deploy-prod-${{ github.run_id }}"
            API_REMOTE="${{ env.REMOTE_DIR_API }}"
            WEB_REMOTE="${{ env.REMOTE_DIR_WEB }}"
            SERVICE_API="${{ env.SERVICE_NAME_API }}"
            SERVICE_WEB="${{ env.SERVICE_NAME_WEB }}"
            API_PORT_FALLBACK="${{ env.API_PORT }}"
            WEB_PORT="${{ env.WEB_PORT }}"

            TAR_API="$RUN_DIR/ondeacho-api.tar.gz"
            TAR_WEB="$RUN_DIR/ondeacho-web.tar.gz"
            test -f "$TAR_API"
            test -f "$TAR_WEB"

            echo "=== API: extrair release ==="
            sudo mkdir -p "$API_REMOTE/releases"
            RELEASE_API="$API_REMOTE/releases/$COMMIT"
            sudo rm -rf "$RELEASE_API"
            sudo mkdir -p "$RELEASE_API"
            sudo tar -xzf "$TAR_API" -C "$RELEASE_API"
            test -f "$RELEASE_API/apps/backend/dist/main.js"
            test -f "$RELEASE_API/apps/backend/dist/database/migrate.js"

            echo "=== Migrações (mesmo EnvironmentFile que a API — evita divergência vs node --env-file) ==="
            sudo test -f /etc/ondeacho-api.env
            sudo systemd-run --wait --collect \
              -p Type=exec \
              -p EnvironmentFile=/etc/ondeacho-api.env \
              /usr/bin/node "$RELEASE_API/apps/backend/dist/database/migrate.js"

            echo "=== API: symlink + systemd + restart ==="
            sudo ln -sfn "$RELEASE_API" "$API_REMOTE/current"
            sudo cp "$RUN_DIR/ondeacho-api.service" "/etc/systemd/system/$SERVICE_API.service"
            sudo systemctl daemon-reload
            sudo systemctl enable "$SERVICE_API"
            sudo systemctl restart "$SERVICE_API"
            sleep 8
            sudo systemctl status "$SERVICE_API" --no-pager -l
            API_PORT="$(grep -E '^[[:space:]]*PORT=' /etc/ondeacho-api.env | head -1 | cut -d= -f2- | tr -d '\r' | tr -d '[:space:]')"
            if [ -z "$API_PORT" ]; then API_PORT="$API_PORT_FALLBACK"; fi
            curl -fsS "http://127.0.0.1:${API_PORT}/api/v1/health" > /dev/null

            echo "=== Site: extrair release ==="
            sudo mkdir -p "$WEB_REMOTE/releases"
            RELEASE_WEB="$WEB_REMOTE/releases/$COMMIT"
            sudo rm -rf "$RELEASE_WEB"
            sudo mkdir -p "$RELEASE_WEB"
            sudo tar -xzf "$TAR_WEB" -C "$RELEASE_WEB"
            test -f "$RELEASE_WEB/apps/web/.next-build/BUILD_ID"
            test -f "$RELEASE_WEB/apps/web/next.config.js"
            test -f "$RELEASE_WEB/node_modules/next/dist/bin/next"

            echo "=== Site: symlink + systemd + restart ==="
            sudo ln -sfn "$RELEASE_WEB" "$WEB_REMOTE/current"
            sudo cp "$RUN_DIR/ondeacho-web.service" "/etc/systemd/system/$SERVICE_WEB.service"
            sudo systemctl daemon-reload
            sudo systemctl enable "$SERVICE_WEB"
            sudo systemctl restart "$SERVICE_WEB"
            sleep 12
            sudo systemctl status "$SERVICE_WEB" --no-pager -l || true
            curl -fsS -o /dev/null "http://127.0.0.1:${WEB_PORT}/login" || {
              echo "::error::Health do site (curl /login) falhou"
              sudo journalctl -u "$SERVICE_WEB" -n 80 --no-pager
              exit 1
            }

            echo "=== Deploy produção concluído (API + migrações + site) ==="

  deploy-admin:
    needs: [ci-node, ci-mobile, paths]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && needs.paths.outputs.admin == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve NEXT_PUBLIC_API_URL
        id: resolve_api
        env:
          FROM_VARS: ${{ vars.NEXT_PUBLIC_API_URL }}
          FROM_SECRETS: ${{ secrets.NEXT_PUBLIC_API_URL }}
          FROM_INPUT: ${{ github.event.inputs.next_public_api_url || '' }}
          FALLBACK: ${{ env.DEFAULT_NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          VAL=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${FROM_INPUT:-}" ]; then
            VAL="${FROM_INPUT}"
            SRC="workflow_dispatch input"
          elif [ -n "${FROM_VARS:-}" ]; then
            VAL="${FROM_VARS}"
            SRC="vars.NEXT_PUBLIC_API_URL"
          elif [ -n "${FROM_SECRETS:-}" ]; then
            VAL="${FROM_SECRETS}"
            SRC="secrets.NEXT_PUBLIC_API_URL"
          else
            VAL="${FALLBACK}"
            SRC="same-origin /api/v1 (proxy Next → API)"
          fi

          echo "NEXT_PUBLIC_API_URL=${VAL}" >> "$GITHUB_ENV"
          echo "::notice::NEXT_PUBLIC_API_URL=${VAL} (${SRC})"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build admin
        env:
          NODE_ENV: production
        run: npm run build --workspace apps/admin

      - name: Prune devDependencies
        run: npm prune --omit=dev

      - name: Package release
        run: |
          set -e
          mkdir -p pkg/apps/admin
          cp package.json package-lock.json pkg/
          cp -r node_modules pkg/
          cp apps/admin/package.json pkg/apps/admin/
          cp apps/admin/next.config.js pkg/apps/admin/
          if [ -f apps/admin/middleware.ts ]; then cp apps/admin/middleware.ts pkg/apps/admin/; fi
          cp -r apps/admin/.next-build pkg/apps/admin/
          tar -czf ondeacho-admin.tar.gz -C pkg .

      - name: Prepare systemd service
        run: |
          REMOTE="${{ env.REMOTE_DIR_ADMIN }}"
          PORT="${{ env.ADMIN_PORT }}"
          cat > ondeacho-admin.service <<EOF
          [Unit]
          Description=OndeAcho Admin (Next.js)
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=${REMOTE}/current/apps/admin
          ExecStart=/usr/bin/node ${REMOTE}/current/node_modules/next/dist/bin/next start -H 0.0.0.0 -p ${PORT}
          Restart=always
          RestartSec=5
          KillSignal=SIGINT
          SyslogIdentifier=ondeacho-admin
          Environment=NODE_ENV=production

          [Install]
          WantedBy=multi-user.target
          EOF

      - name: Upload package to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "ondeacho-admin.tar.gz,ondeacho-admin.service"
          target: "/tmp/deploy-admin-${{ github.run_id }}"
          overwrite: true

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e

            SERVICE_NAME="${{ env.SERVICE_NAME_ADMIN }}"
            REMOTE_DIR="${{ env.REMOTE_DIR_ADMIN }}"
            RUN_DIR="/tmp/deploy-admin-${{ github.run_id }}"
            TAR="$RUN_DIR/ondeacho-admin.tar.gz"
            COMMIT="${{ github.sha }}"
            ADMIN_PORT="${{ env.ADMIN_PORT }}"

            echo "Criando estrutura de pastas..."
            sudo mkdir -p "$REMOTE_DIR/releases"

            RELEASE_DIR="$REMOTE_DIR/releases/$COMMIT"
            sudo rm -rf "$RELEASE_DIR"
            sudo mkdir -p "$RELEASE_DIR"

            echo "Extraindo nova versão..."
            sudo tar -xzf "$TAR" -C "$RELEASE_DIR"

            echo "Validando artefato publicado..."
            test -f "$RELEASE_DIR/apps/admin/.next-build/BUILD_ID"
            test -f "$RELEASE_DIR/apps/admin/next.config.js"
            test -f "$RELEASE_DIR/node_modules/next/dist/bin/next"

            echo "Atualizando symlink current..."
            sudo ln -sfn "$RELEASE_DIR" "$REMOTE_DIR/current"

            echo "Atualizando serviço systemd..."
            sudo cp "$RUN_DIR/ondeacho-admin.service" "/etc/systemd/system/$SERVICE_NAME.service"

            echo "Recarregando systemd..."
            sudo systemctl daemon-reload
            sudo systemctl enable "$SERVICE_NAME"
            sudo systemctl restart "$SERVICE_NAME"

            echo "Aguardando aplicação subir..."
            sleep 12

            echo "Status do serviço:"
            sudo systemctl status "$SERVICE_NAME" --no-pager -l || true

            echo "Testando HTTP local..."
            curl -fsS -o /dev/null "http://127.0.0.1:${ADMIN_PORT}/" || {
              echo "::error::curl falhou; logs:"
              sudo journalctl -u "$SERVICE_NAME" -n 80 --no-pager
              exit 1
            }

            echo "Deploy do admin concluído com sucesso"
